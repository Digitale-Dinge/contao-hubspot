name: CI

on:
    push:
        branches:
            - main
    pull_request: ~

permissions: read-all

jobs:
    rector:
        name: Rector
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, fileinfo, filter, hash, intl, json, mbstring, pcre, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v4

            - name: Install Rector
              uses: ramsey/composer-install@v4
              with:
                  working-directory: vendor-bin/rector

            - name: Run Rector
              run: vendor-bin/rector/vendor/bin/rector process --dry-run --no-progress-bar

    ecs:
        name: ECS
        runs-on: ubuntu-latest
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, fileinfo, filter, hash, intl, json, mbstring, pcre, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v4

            - name: Install ECS
              uses: ramsey/composer-install@v4
              with:
                  working-directory: vendor-bin/ecs

            - name: Run ECS
              run: vendor-bin/ecs/vendor/bin/ecs check --no-progress-bar

    phpstan:
        name: PHPStan
        runs-on: ubuntu-latest
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, fileinfo, filter, hash, intl, json, mbstring, pcre, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v4

            - name: Install PHPStan
              uses: ramsey/composer-install@v4
              with:
                  working-directory: vendor-bin/phpstan

            - name: Run PHPStan
              run: vendor-bin/phpstan/vendor/bin/phpstan analyse --no-progress

    depcheck:
        name: Dependency analyser
        runs-on: ubuntu-latest
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, fileinfo, filter, hash, intl, json, mbstring, pcre, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v4

            - name: Run the dependency analyser
              run: composer depcheck

    tests:
        name: Tests PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, fileinfo, filter, hash, intl, json, mbstring, pcre, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v4

            - name: Run the unit tests
              run: composer unit-tests

    lowest:
        name: Tests lowest dependencies
        runs-on: ubuntu-latest
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: dom, fileinfo, filter, hash, intl, json, mbstring, pcre, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v4
              with:
                  dependency-versions: lowest

            - name: Run the unit tests
              run: composer unit-tests

    nightly:
        name: Tests PHP nightly
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: nightly
                  extensions: dom, fileinfo, filter, hash, intl, json, mbstring, pcre, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v4
              with:
                  composer-options: --ignore-platform-req=php+

            - name: Run the unit tests
              run: composer unit-tests
